services:
  postgres:
    image: postgres:16-alpine
    container_name: globalmentor360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: globalmentor360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `db:push` on a cold start races the server's first boot.
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalmentor360"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
